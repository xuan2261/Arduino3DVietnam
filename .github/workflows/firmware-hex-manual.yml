# Explicit owner request only. Produces AVR Intel HEX artifacts, never uploads
# firmware to hardware or publishes a website. No automatic push hook.
name: Export real Uno HEX firmware (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out requested SHA without saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Set up Arduino CLI 1.5.1
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - name: Install only pinned compiler dependencies in disposable runner
        env:
          ARDUINO_DIRECTORIES_DATA: ${{ runner.temp }}/arduino-data
          ARDUINO_DIRECTORIES_DOWNLOADS: ${{ runner.temp }}/arduino-downloads
          ARDUINO_DIRECTORIES_USER: ${{ runner.temp }}/arduino-user
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli lib install Servo@1.3.0
          test -f "$ARDUINO_DIRECTORIES_USER/libraries/Servo/src/Servo.h"
      - name: Compile and validate allowlisted HEX files, create provenance manifest
        env:
          ARDUINO_DIRECTORIES_DATA: ${{ runner.temp }}/arduino-data
          ARDUINO_DIRECTORIES_DOWNLOADS: ${{ runner.temp }}/arduino-downloads
          ARDUINO_DIRECTORIES_USER: ${{ runner.temp }}/arduino-user
          ARDUINO_SERVO_LIBRARY: ${{ runner.temp }}/arduino-user/libraries/Servo
        run: |
          python -m unittest tests.test_export_firmware -v
          python scripts/export_firmware.py --sha "${GITHUB_SHA}" --output firmware-output
          python scripts/export_firmware.py --sha "${GITHUB_SHA}" --verify firmware-output
      - name: Save firmware artifact even when export fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arduino-uno-avr-hex-files
          path: firmware-output/
          if-no-files-found: warn
