name: Build and Test (deploy only on manual request)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test project structure and asset dependencies
        run: python -m unittest discover -s tests -v
      - name: Build static release
        run: python scripts/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: arduino-3d-viet-site
          path: dist
  release-gates:
    # The app may only be made publicly accessible if both independent,
    # real-world validation runs passed for this exact Git commit.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require exact-SHA compiler and Chromium E2E evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/verify_release_gates.py
  deploy:
    # A private repository must not publish a website simply because main was
    # pushed. GitHub Pages deployment requires an explicit workflow dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: [check, release-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arduino-3d-viet-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
