# Optional integration proof on a disposable Ubuntu runner.
# Explicit workflow_dispatch prevents installs/CI cost on every push.
name: Browser WebGL and Offline E2E (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned Playwright on disposable CI runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Unit and packaging contracts
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_site.py
      - name: Run real browser E2E (including net-offline)
        env:
          ARDUINO_E2E_BROWSER: chromium
        run: python tests/e2e_browser.py > browser-e2e-results.json
      - name: Save screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arduino-browser-e2e-proof
          path: |
            screenshots/
            browser-e2e-results.json
          if-no-files-found: warn
